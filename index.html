<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Anonomuys</title>
</head>
<body>
    <section id="Calculator">
        <div id="display">
            <input type="number" readonly>
        </div>
        <div id="Operators">
            <button id="Operator" onclick="appendToDisplay('+')" >+</button>
            <button id="Operator" onclick="appendToDisplay('-')" >-</button>
            <button id="Operator" onclick="appendToDisplay('*')" >X</button>
            <button id="Operator" onclick="appendToDisplay('/')" >&divide;</button>
            <button id="OperatorClear" onclick=clear()>C</button>
        </div>
        <div id="Numbers">
            <button id="Number" onclick=appendToDisplay(7)>7</button>
            <button id="Number" onclick=appendToDisplay(8)>8</button>
            <button id="Number" onclick=appendToDisplay(9)>9</button>

            <button id="Number" onclick=appendToDisplay(4)>4</button>
            <button id="Number" onclick=appendToDisplay(5)>5</button>
            <button id="Number" onclick=appendToDisplay(6)>6</button>

            <button id="Number" onclick=appendToDisplay(1)>1</button>
            <button id="Number" onclick=appendToDisplay(2)>2</button>
            <button id="Number" onclick=appendToDisplay(3)>3</button>

            <button id="Number" onclick=appendToDisplay(0)>0</button>
        </div>
        <div id="Calculate">
            <button id="Calculate" onclick=Calculate>=</button>
        </div>
    </section>
</body>
</html>
